<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク一覧 - Simple Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">
            <i class="fas fa-list-check"></i> タスク一覧
        </h1>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Task Creation Form -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">新しいタスクを追加</h5>
                <form th:action="@{/tasks}" th:object="${taskForm}" method="post">
                    <div class="input-group">
                        <input type="text"
                               th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                               placeholder="タスクのタイトルを入力してください"
                               maxlength="255">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> 追加
                        </button>
                        <div th:if="${#fields.hasErrors('title')}" class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Task List -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">タスク</h5>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(tasks)}" class="text-center text-muted py-4">
                    <i class="fas fa-inbox fa-3x mb-3"></i>
                    <p>タスクがありません</p>
                </div>

                <!-- Task List -->
                <ul class="list-group" th:if="${!#lists.isEmpty(tasks)}">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="task : ${tasks}">
                        <div class="form-check">
                            <form th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post" style="display: inline;">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:checked="${task.completed}"
                                       onchange="this.form.submit()">
                                <label class="form-check-label"
                                       th:classappend="${task.completed} ? 'text-decoration-line-through text-muted' : ''"
                                       th:text="${task.title}">
                                </label>
                            </form>
                        </div>
                        <div>
                            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit"></i> 編集
                            </a>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('このタスクを削除しますか？');">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i> 削除
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
